<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>777</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #070707;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 600px;
    }

    h1 {
      font-size: clamp(70px, 20vw, 150px);
      letter-spacing: 8px;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      opacity: 0.75;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>777</h1>
    <p>Welcome</p>
  </main>
</body>
</html>
