name: signal-radar-777

services:
  radar:
    build:
      context: .
    image: signal-radar-777:5.2.0
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      RADAR_DATA_DIR: /data
      OIL_DATA_MODE: ${OIL_DATA_MODE:-free-proxy}
      KIMI_RESEARCH_MODE: ${KIMI_RESEARCH_MODE:-off}
      KIMI_RESEARCH_FILE: ${KIMI_RESEARCH_FILE:-/data/kimi-research-shadow.json}
    ports:
      - "${RADAR_BIND_ADDRESS:-0.0.0.0}:${RADAR_PORT:-3000}:3000"
    volumes:
      - radar-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/status').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 8s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  radar-data:
    name: signal-radar-777-data
